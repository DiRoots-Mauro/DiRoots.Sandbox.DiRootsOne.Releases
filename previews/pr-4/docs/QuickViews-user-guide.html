<!doctype html>
<html lang="en-US">
<head><meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickViews</title>
</head>
<body>
  <p id="redirect-fallback">QuickViews opens at <a href="/DiRoots.Sandbox.DiRootsOne.Releases/previews/pr-4/docs/pages/QuickViews/QV-QuickViews.html">the first guide article</a>.</p>
  <script>
    const destination = new URL("/DiRoots.Sandbox.DiRootsOne.Releases/previews/pr-4/docs/pages/QuickViews/QV-QuickViews.html", window.location.origin);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    const fallbackLink = document.querySelector('#redirect-fallback a');
    if (fallbackLink) fallbackLink.href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
